name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint Python
        run: python -m ruff check src ../tests

      - name: Check Python formatting
        run: python -m ruff format --check src ../tests

      - name: Type-check Python
        run: python -m mypy src ../tests/backend

      - name: Test backend
        run: python -m pytest

  plugin:
    name: Studio plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Roblox toolchain
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Install Wally packages
        run: wally install

      - name: Check Luau formatting
        run: stylua --check plugin shared

      - name: Compile plugin model
        run: |
          mkdir -p dist
          rojo build default.project.json --output dist/RobloxAIStudio.rbxm

  container:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: roblox-ai-backend:test
