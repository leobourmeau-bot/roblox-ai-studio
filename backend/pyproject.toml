[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[project]
name = "roblox-ai-backend"
version = "0.1.0"
description = "HTTP backend for the Roblox AI Studio assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
  { name = "Roblox AI contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.139.2,<0.140.0",
  "uvicorn[standard]>=0.51.0,<0.55.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.7.0,<3.0.0",
  "mypy>=1.17.0,<2.0.0",
  "pytest>=9.1.1,<10.0.0",
  "ruff>=0.15.22,<0.16.0",
]

[tool.hatch.build.targets.sdist]
include = ["src/roblox_ai_backend"]

[tool.hatch.build.targets.wheel]
packages = ["src/roblox_ai_backend"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
]
pythonpath = ["src"]
testpaths = ["../tests/backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "../tests"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"../tests/**/*.py" = [
  "PLR2004",
  "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "google"
